<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0908">
<title>Tarjeta NFC/QR · NQ Central</title>
<style>
:root{color-scheme:dark}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0908;color:#f4eee6;font:16px system-ui,sans-serif}.box{max-width:440px;margin:24px;padding:28px;border:1px solid #493525;border-radius:18px;background:#17110e;text-align:center}h1{font-size:1.35rem}p{color:#cdbba9;line-height:1.5}a{color:#d8b17a}
</style>
</head>
<body><main class="box"><h1 id="title">Abriendo el enlace…</h1><p id="message">Estamos comprobando la tarjeta.</p><p id="manual" hidden><a id="target" href="#" rel="noopener noreferrer">Continuar al destino</a></p></main>
<script src="./nq-central-staging-config.js"></script>
<script>
const $=id=>document.getElementById(id);
function fail(message){$('title').textContent='No se pudo abrir la tarjeta';$('message').textContent=message}
function detectDeviceType(){const ua=navigator.userAgent||'';if(/iPad|Tablet/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1))return 'tablet';if(/Mobile|Android|iPhone|iPod/i.test(ua))return 'mobile';if(/Windows|Macintosh|Linux|CrOS/i.test(ua))return 'desktop';return 'unknown'}
function safeHttpsUrl(value){try{const url=new URL(value);return url.protocol==='https:'&&!url.username&&!url.password?url:null}catch{return null}}
async function run(){
 const params=new URLSearchParams(location.search);
 const id=params.get('id');
 const token=new URLSearchParams(location.hash.slice(1)).get('token');
 const config=window.NQ_CENTRAL_STAGING_CONFIG||{};
 const gateway=safeHttpsUrl(config.eventGatewayUrl||'');
 if(!gateway||/\.supabase\.co$/i.test(gateway.hostname)||/\/functions\/v1\//i.test(gateway.pathname)){
  fail('El gateway de staging todavía no está configurado.');return;
 }
 if(!id||!/^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(id)||!token||!/^[a-f0-9]{64}$/.test(token)){
  fail('El enlace no contiene una credencial válida. Pedí al administrador que genere un nuevo enlace seguro.');return;
 }
 history.replaceState(null,'',location.pathname+'?id='+encodeURIComponent(id));
 try{
  const response=await fetch(gateway.href,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({card_id:id,token,device_type:detectDeviceType()}),cache:'no-store',credentials:'omit',referrerPolicy:'no-referrer'});
  let result;try{result=await response.json()}catch{result=null}
  if(!response.ok||!result||result.ok!==true){
   fail(result?.error==='invalid_card'?'Esta credencial fue pausada o no es válida. Pedí un nuevo enlace.':result?.error==='rate_limited'||result?.error==='global_rate_limited'?'La tarjeta está temporalmente limitada. Esperá unos segundos e intentá de nuevo.':'No pudimos verificar la tarjeta de forma segura. Intentá de nuevo.');
   return;
  }
  const target=safeHttpsUrl(result.target_url);
  if(!target){fail('El destino de esta tarjeta no es válido. Contactá al administrador.');return}
  $('title').textContent='Listo';$('message').textContent='Abriendo el destino…';$('target').href=target.href;$('manual').hidden=false;
  location.replace(target.href);
 }catch(e){console.error('Secure staging card open failed:',e);fail('No pudimos conectar con el registro seguro. Intentá de nuevo.')}
}
run();
</script>
</body></html>
