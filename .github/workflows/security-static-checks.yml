name: Security static checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Parse inline JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess
          import tempfile

          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.current = None
                  self.items = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      attrs = dict(attrs)
                      if "src" not in attrs:
                          self.current = {"type": attrs.get("type", ""), "body": []}
              def handle_data(self, data):
                  if self.current is not None:
                      self.current["body"].append(data)
              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.current is not None:
                      self.items.append(self.current)
                      self.current = None

          for filename in ("index.html", "card.html"):
              parser = Scripts()
              parser.feed(Path(filename).read_text(encoding="utf-8"))
              for i, item in enumerate(parser.items):
                  suffix = ".mjs" if item["type"] == "module" else ".js"
                  with tempfile.NamedTemporaryFile("w", suffix=suffix, encoding="utf-8") as f:
                      f.write("".join(item["body"]))
                      f.flush()
                      subprocess.run(["node", "--check", f.name], check=True)
              print(f"{filename}: checked {len(parser.items)} inline script(s)")
          PY

      - name: Smoke-test deployed Edge Function input validation
        shell: bash
        run: |
          # Keep CI smoke tests isolated to NQ Central Security Test; never hit the live restaurant project.
          KEY='sb_publishable_pf86bqfSq1qq1HwQ0ECFjw_fz_DPzLw'
          ENDPOINT='https://rxxbmqilnozcnpwguqga.supabase.co/functions/v1/register-nfc-event'
          STATUS=$(curl --silent --show-error --output /tmp/edge-response.json --write-out "%{http_code}" \
            -X POST "$ENDPOINT" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" \
            --data '{"card_id":"invalid","token":"invalid","device_type":"mobile"}')
          cat /tmp/edge-response.json
          test "$STATUS" = "400"
          grep -q '"error":"invalid_request"' /tmp/edge-response.json

          STATUS=$(curl --silent --show-error --output /tmp/edge-invalid-token.json --write-out "%{http_code}" \
            -X POST "$ENDPOINT" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" \
            --data '{"card_id":"11111111-1111-4111-8111-111111111111","token":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","device_type":"mobile"}')
          cat /tmp/edge-invalid-token.json
          test "$STATUS" = "200"
          grep -q '"error":"invalid_card"' /tmp/edge-invalid-token.json

      - name: Assert security invariants
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path("index.html").read_text(encoding="utf-8")
          card = Path("card.html").read_text(encoding="utf-8")
          edge = Path("supabase/security-test/functions/register-nfc-event/index.ts").read_text(encoding="utf-8")
          production_edge = Path("supabase/functions/register-business-card-event/index.ts").read_text(encoding="utf-8")
          production_rate_migration = Path("supabase/migrations/015_add_business_card_rate_limits.sql").read_text(encoding="utf-8")

          assert "from('nfc_events')" not in index, "Admin/client HTML must not directly query or write legacy nfc_events"
          assert "SUPABASE_SERVICE_ROLE_KEY" not in index and "SUPABASE_SERVICE_ROLE_KEY" not in card, "Service role env name leaked into public HTML"
          assert "new URLSearchParams(location.hash.slice(1)).get('token')" in card, "Scanner must read bearer token from URL fragment"
          assert "history.replaceState" in card, "Scanner must remove token from address bar"
          assert "/functions/v1/register-business-card-event" in card, "Scanner must call secure event endpoint"
          assert "from('nfc_events').insert" not in card, "Scanner must not write legacy events directly"
          assert "crypto.subtle.digest" in edge, "Edge Function must hash raw token server-side"
          assert 'Deno.env.get("SUPABASE_SERVICE_ROLE_KEY")' in edge, "Edge Function must read service role only from server environment"
          assert "sb_secret_" not in index and "sb_secret_" not in card and "sb_secret_" not in edge and "sb_secret_" not in production_edge, "Secret-format key found in source"
          assert 'consume_business_card_rate_limit' in production_edge, "Production scanner endpoint must enforce database rate limits"
          assert 'readJsonBodyLimited(req, 2048)' in production_edge, "Production scanner endpoint must cap streamed request size"
          assert 'readJsonBodyLimited(req, 2048)' in edge, "Test scanner endpoint must cap streamed request size"
          assert 'CREATE TABLE IF NOT EXISTS public.app_business_card_rate_limits' in production_rate_migration, "Production rate-limit table migration missing"
          assert 'GRANT EXECUTE ON FUNCTION public.consume_business_card_rate_limit(text, integer, integer) TO service_role' in production_rate_migration, "Rate limiter must be service_role-only"
          print("Security invariants passed.")
          PY
